name: Unit Tests — Python Services

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # recomendacion-service
  # ────────────────────────────────────────────────────────────────────────────
  unit-recomendacion:
    name: recomendacion-service · pytest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: recomendacion-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            recomendacion-service/requirements.txt
            recomendacion-service/requirements-test.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run unit tests with coverage
        run: |
          pytest tests/test_geo_math.py tests/test_recommender.py tests/test_schemas.py \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json \
            --cov-report=html:htmlcov \
            -v

      - name: Coverage summary → GitHub Step Summary
        run: |
          python - <<'PYEOF'
          import json, os
          with open("coverage.json") as f:
              data = json.load(f)
          t = data["totals"]
          pct = t["percent_covered"]
          icon = "🟢" if pct >= 80 else ("🟡" if pct >= 60 else "🔴")
          lines = [
              "## Coverage — recomendacion-service",
              "",
              f"{icon} **Total: {pct:.1f}%** &nbsp; ({t['covered_lines']}/{t['num_statements']} statements, {t['missing_lines']} missing)",
              "",
              "| File | Stmts | Miss | Cover |",
              "|------|------:|-----:|------:|",
          ]
          for path, info in sorted(data["files"].items()):
              short = path.replace("app/", "")
              s = info["summary"]
              p = s["percent_covered"]
              fi = "🟢" if p >= 80 else ("🟡" if p >= 60 else "🔴")
              lines.append(f"| `{short}` | {s['num_statements']} | {s['missing_lines']} | {fi} {p:.1f}% |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          PYEOF

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-recomendacion-html
          path: recomendacion-service/htmlcov/
          retention-days: 7

      - name: Upload XML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-recomendacion-xml
          path: recomendacion-service/coverage.xml
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # gasolineras-service
  # ────────────────────────────────────────────────────────────────────────────
  unit-gasolineras:
    name: gasolineras-service · pytest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gasolineras-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: gasolineras-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests with coverage
        run: |
          pytest tests/test_models.py tests/test_sync_parser.py tests/test_fetch_gobierno.py \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json \
            --cov-report=html:htmlcov \
            -v

      - name: Coverage summary → GitHub Step Summary
        run: |
          python - <<'PYEOF'
          import json, os
          with open("coverage.json") as f:
              data = json.load(f)
          t = data["totals"]
          pct = t["percent_covered"]
          icon = "🟢" if pct >= 80 else ("🟡" if pct >= 60 else "🔴")
          lines = [
              "## Coverage — gasolineras-service",
              "",
              f"{icon} **Total: {pct:.1f}%** &nbsp; ({t['covered_lines']}/{t['num_statements']} statements, {t['missing_lines']} missing)",
              "",
              "| File | Stmts | Miss | Cover |",
              "|------|------:|-----:|------:|",
          ]
          for path, info in sorted(data["files"].items()):
              short = path.replace("app/", "")
              s = info["summary"]
              p = s["percent_covered"]
              fi = "🟢" if p >= 80 else ("🟡" if p >= 60 else "🔴")
              lines.append(f"| `{short}` | {s['num_statements']} | {s['missing_lines']} | {fi} {p:.1f}% |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          PYEOF

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-gasolineras-html
          path: gasolineras-service/htmlcov/
          retention-days: 7

      - name: Upload XML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-gasolineras-xml
          path: gasolineras-service/coverage.xml
          retention-days: 7
