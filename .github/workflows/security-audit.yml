name: Security Audit — Dependencies

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Auditoría diaria a las 07:00 UTC — detecta CVEs publicados entre deploys
    - cron: '0 7 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Auditoría de dependencias JavaScript/Node
  # ────────────────────────────────────────────────────────────────────────────
  audit-node:
    name: npm audit — Node services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: frontend-client,         dir: frontend-client }
          - { name: usuarios-service,        dir: usuarios-service }
          - { name: gateway-hono,            dir: gateway-hono }
          - { name: voice-assistant-service, dir: voice-assistant-service }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.service.dir }}

      - name: npm audit (${{ matrix.service.name }})
        # --audit-level=high: falla solo en vulnerabilidades altas o críticas
        run: npm audit --audit-level=high
        working-directory: ${{ matrix.service.dir }}

  # ────────────────────────────────────────────────────────────────────────────
  # Auditoría de dependencias Python
  # ────────────────────────────────────────────────────────────────────────────
  audit-python:
    name: pip-audit — Python services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: gasolineras-service,   dir: gasolineras-service }
          - { name: recomendacion-service, dir: recomendacion-service }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ${{ matrix.service.dir }}/requirements.txt

      - name: Install pip-audit + dependencies
        run: |
          pip install pip-audit
          pip install -r requirements.txt
        working-directory: ${{ matrix.service.dir }}

      - name: pip-audit (${{ matrix.service.name }})
        run: pip-audit --strict
        working-directory: ${{ matrix.service.dir }}
