 # Solo permitir fallback SPA para rutas conocidas
map $uri $spa_fallback {
    default =404;
    =/ /index.html;
    ~^/(login|register|gasolineras|mapa|recarga|rutas|profile|favoritos|legal|privacy|accessibility|faq)/?$ /index.html;
    ~^/gasolinera/[^/]+/?$ /index.html;
}

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Google OAuth popup compatibility
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Embedder-Policy "unsafe-none" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cachear assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Evitar cache agresivo de service worker y workbox
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location ~* ^/workbox-.*\.js$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # SPA: Solo rutas permitidas van a index.html, el resto 404
    location / {
        try_files $uri $uri/ $spa_fallback;
    }

    # Health check para Docker
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
