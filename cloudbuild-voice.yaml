steps:
  # 1. Construir la imagen Docker apuntando a la carpeta del microservicio
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'europe-west1-docker.pkg.dev/$PROJECT_ID/tankgo/voice-img', './voice-assistant-service']

  # 2. Subir la imagen al registro de Google (Artifact Registry)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west1-docker.pkg.dev/$PROJECT_ID/tankgo/voice-img']

  # 3. Desplegar en Cloud Run
  # Nota: no se fuerza allow-unauthenticated aqui para evitar fallos IAM en trigger.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'voice-assistant-service'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/tankgo/voice-img'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--timeout'
      - '1800'
      - '--concurrency'
      - '20'
      - '--cpu'
      - '1'
      - '--memory'
      - '1Gi'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'
      - '--session-affinity'

  # 4. Smoke test — verifica que el servicio está Ready tras el deploy
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -e
        READY=$$(gcloud run services describe voice-assistant-service \
          --region europe-west1 \
          --format 'value(status.conditions[0].status)')
        URL=$$(gcloud run services describe voice-assistant-service \
          --region europe-west1 \
          --format 'value(status.url)')
        echo "🔍 voice-assistant-service → $$URL (Ready: $$READY)"
        if [ "$$READY" != "True" ]; then
          echo "❌ Servicio no está Ready (estado: $$READY)"
          exit 1
        fi
        echo "✅ voice-assistant-service desplegado y Ready"

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/tankgo/voice-img'

options:
  logging: CLOUD_LOGGING_ONLY