steps:
  # 1. Construir la imagen Docker apuntando a la carpeta del microservicio
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'europe-west1-docker.pkg.dev/$PROJECT_ID/tankgo/voice-img', './voice-assistant-service']

  # 2. Subir la imagen al registro de Google (Artifact Registry)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west1-docker.pkg.dev/$PROJECT_ID/tankgo/voice-img']

  # 3. Desplegar en Cloud Run
  # Nota: no se fuerza allow-unauthenticated aqui para evitar fallos IAM en trigger.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'voice-assistant-service'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/tankgo/voice-img'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--timeout'
      - '1800'
      - '--concurrency'
      - '20'
      - '--cpu'
      - '1'
      - '--memory'
      - '1Gi'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'
      - '--session-affinity'

  # 4. Smoke test — verifica que el servicio responde tras el deploy
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -e
        SERVICE_URL=$$(gcloud run services describe voice-assistant-service \
          --region europe-west1 \
          --format 'value(status.url)')
        TOKEN=$$(curl -sf -H "Metadata-Flavor: Google" \
          "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/identity?audience=$$SERVICE_URL&format=full")
        echo "🔍 Smoke test: $$SERVICE_URL"

        STATUS=$$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
          -H "Authorization: Bearer $$TOKEN" \
          "$$SERVICE_URL/health")
        if [ "$$STATUS" != "200" ]; then
          echo "❌ /health devolvió $$STATUS (esperado 200)"
          exit 1
        fi
        echo "✅ voice-assistant-service /health OK"

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/tankgo/voice-img'

options:
  logging: CLOUD_LOGGING_ONLY