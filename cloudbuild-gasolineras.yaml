steps:
  # 1. Construir la imagen Docker apuntando a la carpeta del microservicio
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'europe-west1-docker.pkg.dev/$PROJECT_ID/tankgo/gasolineras-img', './gasolineras-service']

  # 2. Subir la imagen al registro de Google (Artifact Registry)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west1-docker.pkg.dev/$PROJECT_ID/tankgo/gasolineras-img']

  # 3. Desplegar en Cloud Run
  # Nota: no se fuerza allow-unauthenticated aqui para evitar fallos IAM en trigger.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'gasolineras-service'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/tankgo/gasolineras-img'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'

  # 4. Smoke test — verifica que el servicio está Ready tras el deploy
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -e
        READY=$$(gcloud run services describe gasolineras-service \
          --region europe-west1 \
          --format 'value(status.conditions[0].status)')
        URL=$$(gcloud run services describe gasolineras-service \
          --region europe-west1 \
          --format 'value(status.url)')
        echo "🔍 gasolineras-service → $$URL (Ready: $$READY)"
        if [ "$$READY" != "True" ]; then
          echo "❌ Servicio no está Ready (estado: $$READY)"
          exit 1
        fi
        echo "✅ gasolineras-service desplegado y Ready"

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/tankgo/gasolineras-img'

options:
  logging: CLOUD_LOGGING_ONLY