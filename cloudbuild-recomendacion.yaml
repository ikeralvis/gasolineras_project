steps:
  # 1. Construir la imagen Docker apuntando a la carpeta del microservicio
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}', './recomendacion-service']

  # 2. Subir la imagen al registro de Google (Artifact Registry)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}']

  # 3. Desplegar en Cloud Run
  # Nota: no se fuerza allow-unauthenticated aqui para evitar fallos IAM en trigger.
  # Configura visibilidad publica/privada desde Cloud Run UI una sola vez (via IAM).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--port'
      - '8001'
      - '--set-env-vars'
      - 'ROUTING_BACKEND=${_ROUTING_BACKEND},ROUTING_FAILOVER_TO_OSRM=${_ROUTING_FAILOVER_TO_OSRM},ALLOW_STRAIGHT_LINE_FALLBACK=${_ALLOW_STRAIGHT_LINE_FALLBACK},ROUTE_CANDIDATES_SOURCE=${_ROUTE_CANDIDATES_SOURCE},POI_ACCESS_PROVIDER=${_POI_ACCESS_PROVIDER},ACCESS_FILTER_MODE=${_ACCESS_FILTER_MODE},GASOLINERAS_API_URL=${_GASOLINERAS_API_URL}'
      - '--set-secrets'
      - 'ORS_API_KEY=ORS_API_KEY:latest'

  # 4. Smoke test — verifica que el servicio está Ready tras el deploy
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -e
        READY=$$(gcloud run services describe ${_SERVICE_NAME} \
          --region ${_REGION} \
          --format 'value(status.conditions[0].status)')
        URL=$$(gcloud run services describe ${_SERVICE_NAME} \
          --region ${_REGION} \
          --format 'value(status.url)')
        echo "🔍 ${_SERVICE_NAME} → $$URL (Ready: $$READY)"
        if [ "$$READY" != "True" ]; then
          echo "❌ Servicio no está Ready (estado: $$READY)"
          exit 1
        fi
        echo "✅ ${_SERVICE_NAME} desplegado y Ready"

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}'

substitutions:
  _REGION: 'europe-west1'
  _REPOSITORY: 'tankgo'
  _IMAGE_NAME: 'recomendacion-img'
  _SERVICE_NAME: 'recomendacion-service'
  _ROUTING_BACKEND: 'ors'
  _ROUTING_FAILOVER_TO_OSRM: 'true'
  _ALLOW_STRAIGHT_LINE_FALLBACK: 'false'
  _ROUTE_CANDIDATES_SOURCE: 'auto'
  _POI_ACCESS_PROVIDER: 'osm'
  _ACCESS_FILTER_MODE: 'strict'
  _GASOLINERAS_API_URL: 'https://api.tankgo.dev/api/gasolineras/?limit=20000'

options:
  logging: CLOUD_LOGGING_ONLY